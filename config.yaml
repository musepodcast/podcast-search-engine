  domain_re: '\b([a-z0-9\-]+\.)+(com|net|org|io|co|tv|fm)\b'
  urlish_re: 'https?://|www\.'
  cta_re: '\b(click|tap|visit|use|enter|subscribe|follow|download|learn more|shop now)\b'
