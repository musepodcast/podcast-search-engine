summarizer:
  model: "Falconsai/text_summarization"
  max_length: 35
  min_length: 6

chapter_generation:
  similarity_threshold: 0.30
  max_chapters: 60
  aggregation_window_size: 30
  title:
    min_words: 4
    max_words: 12
    case: "title"
    drop_sponsor_segments: true


gpu:
  memory_fraction: 1.0     # limit to 90% of GPU RAM
  precision: fp16          # optional: run models in half‑precision