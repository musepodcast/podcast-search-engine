summarizer:
  model: facebook/bart-large-cnn
  min_length: 6
  max_length: 32

chapter_generation:
  similarity_threshold: 0.55
  aggregation_window_size: 40
  max_chapters: 60
  title:
    style: sentence
    min_words: 8
    max_words: 24
    min_first_chapter_sec: 90
    min_gap_sec: 90
    drop_sponsor_segments: true

gpu:
  memory_fraction: 1.0
  precision: fp16

text_rules:
  small_words:
    - a
    - an
    - and
    - as
    - at
    - but
    - by
    - for
    - in
    - nor
    - of
    - on
    - or
    - per
    - so
    - the
    - to
    - via

  pronoun_starts:
    - "i "
    - "i’m"
    - "im "
    - "you "
    - "we "
    - "they "

  boundary_tokens: ['.', '!', '?', '…', '—', '–', ';', ':']

