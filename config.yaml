  sponsor_patterns:
    - '\bthis episode (is|was)\s+(brought to you by|brought to|presented by)\b'
    - '\bsponsored by\b'
    - '\bad(vertisement)?\s*(break|read)?\b'
    - '\bpromo\s*code\b'
    - '\b(use|enter)\s+code\s+[A-Za-z0-9\-]+\b'
    - '\bhappy\s+dad\b'
    - '\bfarmers?\s+dog\b'
    - '\bmanscaped\b'
    - '\bnord\s?vpn\b'
    - '\bsquarespace\b'
    - '\baudible\b'
    - '\bshopify\b'
    - '\bbetterhelp\b'
    - '\b(raid\s+shadow\s+legends|raycon|hellofresh)\b'
